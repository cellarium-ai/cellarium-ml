# lightning.pytorch==2.4.0
seed_everything: true
trainer:
  accelerator: auto
  num_nodes: 1
  max_epochs: 20
  default_root_dir: null
model:
  cpu_transforms:
  - class_path: cellarium.ml.transforms.Filter
    init_args:
      filter_list:
        !FileLoader
        file_path: ${highly_variable_genes_csv}
        loader_fn: pandas.read_csv
        attr: "ensembl_id"
        convert_fn: pandas.Series.to_list
  transforms: null
  model:
    class_path: cellarium.ml.models.AmortizedOnlineNonNegativeMatrixFactorization
    init_args:
      var_names_g: null
      k_values: ${k_values}
      r: ${num_repeats}
      latent_dim: 256
      encoder_improvement_threshold: 1.0e-4
      trigger_patience: 3
      cooldown_patience: 7
      max_cooldown_epochs: 1.0
      trailing_window_fraction: 0.25
      total_n_cells: null
      batch_size: null
  is_initialized: false
data:
  dadc:
    class_path: cellarium.ml.data.DistributedAnnDataCollection
    init_args:
      filenames: ${dataset_h5ad}
      limits: [${dataset_ncells}]
      shard_size: ${dataset_ncells}
      last_shard_size: null
      max_cache_size: 2
      cache_size_strictly_enforced: true
      indices_strict: true
  batch_keys:
    x_ng:
      attr: X
      convert_fn: cellarium.ml.utilities.data.densify
    var_names_g:
      attr: var_names
  batch_size: 1024
  shuffle: true
  drop_last_indices: false
  test_mode: false
  num_workers: 0

ckpt_path: null
