# lightning.pytorch==2.5.2
seed_everything: true
trainer:
  accelerator: gpu
  strategy:
    class_path: lightning.pytorch.strategies.DDPStrategy
    dict_kwargs:
      broadcast_buffers: false
      find_unused_parameters: false
  devices: 1
  num_nodes: 1
  precision: 32-true
  max_epochs: 1 #1000
  min_epochs: 1
  max_steps: 2 #-1
  check_val_every_n_epoch: null
  log_every_n_steps: 10
  val_check_interval: 1 # 500
  limit_val_batches: 1
  gradient_clip_val: 10.0
  gradient_clip_algorithm: norm
  default_root_dir: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/models/SOCAM_lambda_experiment_models/lambda_0.1
  logger:
  - class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/models/SOCAM_lambda_experiment_models/lambda_0.1
      name: lightning_logs
      version: corrected_run1
  - class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: "socam-lambda_trial"
      name: "socam_lam0.1"
      save_dir: "/tmp/wandb"
      log_model: false
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: false
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      every_n_train_steps: 500
      filename: epoch={epoch}-step={step}
      save_top_k: -1
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      every_n_epochs: 1
      filename: model
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
  - class_path: cellarium.ml.callbacks.MetaSafeEarlyStopping
    init_args:
      monitor: val_loss
      mode: min
      patience: 30
      min_delta: 0.0001
      check_on_train_epoch_end: false
model:
  optim_fn: torch.optim.Adam
  optim_kwargs:
    lr: 5e-3
  cpu_transforms:
  - class_path: cellarium.ml.transforms.Filter
    init_args:
      filter_list:
        !FileLoader
        file_path: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/models/shared_metadata/features_TPM_above_1_intersection_with_CAS_lrexp_human_train.csv
        loader_fn: pandas.read_csv
        attr: original_feature_id
        convert_fn: pandas.Series.to_list
      ordering: true
  transforms:
  - cellarium.ml.transforms.Densify
  - class_path: cellarium.ml.transforms.NormalizeTotal
    init_args:
      target_count: 10000
      eps: 1.0e-06
  - class_path: cellarium.ml.transforms.Log1p
  - class_path: cellarium.ml.transforms.DivideByScale
    init_args:
      scale_g:
        !CheckpointLoader
        file_path: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/models/tdigest_NT_log1p_lrexp_human/lightning_logs/version_0/checkpoints/epoch=0-step=420.ckpt
        attr: model.median_g
        convert_fn: torch.Tensor.float
      var_names_g:
        !CheckpointLoader
        file_path: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/models/tdigest_NT_log1p_lrexp_human/lightning_logs/version_0/checkpoints/epoch=0-step=420.ckpt
        attr: model.var_names_g
        convert_fn: null
  model:
    class_path: cellarium.ml.models.SOCAM
    init_args:
      n_obs: null
      var_names_g: null
      W_prior_scale: 10.0
      descendant_tensor:
        !FileLoader
        file_path: https://github.com/obophenotype/cell-ontology/releases/download/v2024-01-04/cl.owl
        loader_fn: cellarium.ml.utilities.data.get_cl_descendant_tensor_from_owl
      cl_names:
        !FileLoader
        file_path: https://github.com/obophenotype/cell-ontology/releases/download/v2024-01-04/cl.owl
        loader_fn: cellarium.ml.utilities.data.get_cl_names_from_owl
      cl_name_subset: null
      probability_propagation_flag: true
      seed: 0
  is_initialized: false
data:
  dadc:
    class_path: cellarium.ml.data.DistributedAnnDataCollection
    init_args:
      filenames: gs://cellarium-file-system-cas-archive/curriculum/lrexp_human_training_split_20241106/extract_files/extract_{0..4198}.h5ad
      limits: null
      shard_size: 10000
      last_shard_size: 515
      max_cache_size: 3
      cache_size_strictly_enforced: true
      label: null
      keys: null
      index_unique: null
      convert: null
      indices_strict: true
      obs_columns_to_validate: []
  batch_keys:
    x_ng:
      attr: X
      convert_fn: cellarium.ml.utilities.data.keep_sparse
    var_names_g:
      attr: var_names
    total_mrna_umis_n:
      attr: obs
      key: total_mrna_umis
    cl_names_n:
      attr: obs
      key: cell_type_ontology_term_id
    obs_names_n:
      attr: obs_names
  batch_size: 8192
  iteration_strategy: cache_efficient
  shuffle: true
  drop_last_indices: false
  val_size: 0.02
  num_workers: 24
  drop_incomplete_batch: false
  prefetch_factor: 4
  persistent_workers: true
ckpt_path: null
