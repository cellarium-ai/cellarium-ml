# lightning.pytorch==2.5.2
seed_everything: true
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks:
  - class_path: cellarium.ml.callbacks.SOCAMHopScoringPredictionWriter
    init_args:
      output_dir: gs://YOUR_BUCKET/YOUR_PREFIX/socam_hop_scoring_predictions
      co_resource_path: gs://YOUR_BUCKET/YOUR_PREFIX/cell_ontology_hop_resource.pkl
      key: cell_type_probs_nc
      obs_names_key: obs_names_n
      ground_truth_key: cl_names_n
      num_hops: 4
      gzip: false
      ontology_term_id_replace_from: ":"
      ontology_term_id_replace_to: "_"
  limit_predict_batches: null
  enable_checkpointing: false
  enable_progress_bar: true
  inference_mode: true
  use_distributed_sampler: true
  default_root_dir: null
model:
  optim_fn: torch.optim.Adam
  optim_kwargs:
    lr: 5e-3
  cpu_transforms:
  - class_path: cellarium.ml.transforms.Filter
    init_args:
      filter_list:
        !FileLoader
        file_path: /path/to/hvg_genes.csv
        loader_fn: pandas.read_csv
        attr: feature_id
        convert_fn: pandas.Series.to_list
  transforms:
  - cellarium.ml.transforms.Densify
  - class_path: cellarium.ml.transforms.NormalizeTotal
    init_args:
      target_count: 10000
      eps: 1.0e-06
  - class_path: cellarium.ml.transforms.Log1p
  - class_path: cellarium.ml.transforms.DivideByScale
    init_args:
      scale_g:
        !CheckpointLoader
        file_path: /path/to/tdigest.ckpt
        attr: model.median_g
        convert_fn: torch.Tensor.float
      var_names_g:
        !CheckpointLoader
        file_path: /path/to/tdigest.ckpt
        attr: model.var_names_g
  model:
    class_path: cellarium.ml.models.SOCAM
    init_args:
      n_obs: null
      var_names_g: null
      W_prior_scale: 1e-2
      descendant_tensor:
        !FileLoader
        file_path: https://github.com/obophenotype/cell-ontology/releases/download/v2025-07-30/cl-basic.owl
        loader_fn: cellarium.ml.utilities.data.get_cl_descendant_tensor_from_owl
      cl_names:
        !FileLoader
        file_path: https://github.com/obophenotype/cell-ontology/releases/download/v2025-07-30/cl-basic.owl
        loader_fn: cellarium.ml.utilities.data.get_cl_names_from_owl
      cl_name_subset: null
      probability_propagation_flag: true
      seed: 0
  is_initialized: false
data:
  dadc:
    class_path: cellarium.ml.data.DistributedAnnDataCollection
    init_args:
      filenames: gs://YOUR_BUCKET/YOUR_PREFIX/predict_input_{000000..001000}.h5ad
      limits: null
      shard_size: 10000
      max_cache_size: 3
      cache_size_strictly_enforced: true
      label: null
      keys: null
      index_unique: null
      convert: null
      indices_strict: true
      obs_columns_to_validate: []
  batch_keys:
    x_ng:
      attr: X
      convert_fn: cellarium.ml.utilities.data.keep_sparse
    var_names_g:
      attr: var
      key: feature_id
    cl_names_n:
      attr: obs
      key: cell_type_ontology_term_id
    obs_names_n:
      attr: obs_names
  batch_size: 4096
  iteration_strategy: cache_efficient
  shuffle: false
  drop_last_indices: false
  num_workers: 12
  drop_incomplete_batch: false
  prefetch_factor: 4
  persistent_workers: true
return_predictions: false
ckpt_path: /path/to/lambda_100_socam.ckpt
